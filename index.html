<style>
:root{--ink:#111;--t2:#555;--t3:#8a8a8a;--rule:#e6e6e6;--page:#fff;--well:#f6f6f6;--surround:#141414;--sold:#9a3b2c;--radius:2px}
*{box-sizing:border-box}
html{background:var(--surround)}
body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sheet{max-width:1200px;margin:24px auto;background:var(--page);min-height:calc(100vh - 48px)}
@media(max-width:760px){.sheet{margin:0;min-height:100vh}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 32px;border-bottom:1px solid var(--rule)}
@media(max-width:760px){.nav,.head,.tabs,.adm{padding-left:18px;padding-right:18px}.nav .brand{display:none}.nav .right{margin-left:auto}}
.nav .brand{font-weight:600;letter-spacing:.02em;font-size:15px}
.nav .right{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:#fff}
.pill button{padding:7px 14px;font-size:13px;color:var(--t2)}
.pill button[aria-pressed=true]{background:var(--ink);color:#fff}
.icon{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--t2)}
.icon[aria-pressed=true]{background:var(--ink);color:#fff}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.adm{display:none;border-bottom:1px solid var(--rule);background:var(--well);padding:8px 32px;font-size:13px;color:var(--t2)}
body.admin .adm{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.adm b{color:var(--ink);font-weight:600;margin-right:6px}
.adm button{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.adm .st{margin-left:auto;color:var(--t3)}
[contenteditable=true]{outline:1px dashed #bbb;outline-offset:4px;border-radius:2px}
[contenteditable=true]:focus{outline-color:var(--ink)}
.head{padding:36px 32px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:500;margin:0;line-height:1.15;letter-spacing:-.01em}
.head h2{font-size:15px;font-weight:400;color:var(--t2);margin:6px 0 0}
.head p{margin:12px 0 0;max-width:62ch;color:var(--t2)}
.sortbox select{border:1px solid var(--rule);border-radius:999px;padding:8px 14px;background:#fff;font-size:13px}
.tabs{display:flex;gap:26px;padding:0 32px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{padding:12px 0;font-size:14px;color:var(--t2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs button span{color:var(--t3);margin-left:6px;font-size:12px}
.wrap{display:grid;grid-template-columns:250px 1fr}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
aside{border-right:1px solid var(--rule);padding:24px 28px}
@media(max-width:900px){aside{display:none;position:fixed;inset:0;background:#fff;z-index:30;overflow:auto;border:0}aside.open{display:block}}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.fhead .n{font-size:14px;font-weight:500}
aside input[type=search]{width:100%;border:1px solid var(--rule);padding:9px 12px;border-radius:var(--radius);margin-bottom:18px}
.grp{border-top:1px solid var(--rule);padding:14px 0}
.grp summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.grp summary::-webkit-details-marker{display:none}
.grp summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--t2);border-bottom:1.5px solid var(--t2);transform:rotate(45deg);margin:6px 4px 0 0}
.grp[open] summary::after{transform:rotate(-135deg);margin-top:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding-top:12px}
.opts.one{grid-template-columns:1fr}
.opts label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--t2);cursor:pointer}
.opts input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.clear{margin-top:16px;font-size:13px;color:var(--t2);text-decoration:underline;text-underline-offset:3px}
.mfilt{display:none;margin:14px 18px 0;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font-size:13px}
@media(max-width:900px){.mfilt{display:inline-flex;gap:6px}}
.res{padding:20px 24px 48px}
@media(max-width:760px){.res{padding:16px 14px 40px}}
.res .meta{display:flex;justify-content:space-between;color:var(--t3);font-size:13px;margin:0 8px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--rule);padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;position:relative}
.card.is-sold .price{color:var(--t3)}
.card.is-hidden{outline:1px dashed #c5c5c5;outline-offset:-6px}
.ctop{display:flex;justify-content:space-between;gap:12px}
.ctop .name{font-size:18px;font-weight:500;line-height:1.2}
.ctop .brand{font-size:13px;color:var(--t2);margin-top:3px}
.ctop .pr{text-align:right;flex:0 0 auto}
.price{font-size:18px;font-weight:500;line-height:1.2}
.rrp{font-size:12px;color:var(--t3);margin-top:3px}
.rrp s{color:var(--t3)}
.status{font-size:12px;color:var(--t2);margin-top:3px}
.status.sold{color:var(--sold)}
.img{aspect-ratio:4/3;background:var(--well);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--t3);font-size:13px}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats div{padding:12px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--rule)}
.stats b{display:block;font-weight:500;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stats span{display:block;font-size:11px;color:var(--t3);margin-top:4px}
.note{font-size:13px;color:var(--t2);margin:0;min-height:1.5em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--rule);border-radius:999px;padding:3px 9px;color:var(--t2)}
.tag.warn{border-color:#d8b4a5;color:var(--sold)}
.cbtns{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;border:1px solid var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.6}
.btn.lite{color:var(--ink);background:#fff}
.btn.sm{padding:6px 12px;font-size:12px}
.ctools{display:none;gap:4px;justify-content:flex-end}
body.admin .ctools{display:flex}
.ctools button{min-width:28px;height:26px;padding:0 9px;border:1px solid var(--rule);border-radius:999px;background:#fff;font-size:11px;color:var(--t2)}
.ctools button:hover{border-color:var(--ink);color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--rule);position:relative}
@media(max-width:600px){.row{grid-template-columns:64px 1fr auto}.row .rb{display:none}}
.row .th{width:84px;height:64px;background:var(--well);overflow:hidden;cursor:pointer}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .rn{font-weight:500;font-size:15px}
.row .rs{font-size:12px;color:var(--t2)}
.row .rp{text-align:right}
.row.is-sold .price{color:var(--t3)}
.row .ctools{flex-wrap:nowrap}
.empty{padding:60px 8px;color:var(--t3);text-align:center}
.dlg{position:fixed;inset:0;background:rgba(20,20,20,.7);display:none;z-index:40;overflow:auto}
.dlg.open{display:block}
.dlg .box{max-width:960px;margin:24px auto;background:#fff;padding:28px 32px 36px;min-height:60vh}
@media(max-width:760px){.dlg .box{margin:0;min-height:100vh;padding:20px 18px 40px}}
.dlg .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dlg h3{margin:0;font-size:24px;font-weight:500;line-height:1.15}
.dlg .brand{color:var(--t2);font-size:14px;margin-top:4px}
.x{width:36px;height:36px;border:1px solid var(--rule);border-radius:999px;font-size:18px;color:var(--t2);flex:0 0 auto}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:20px 0 8px;padding-bottom:6px}
.gal>*{scroll-snap-align:start;flex:0 0 min(86vw,640px);background:var(--well);max-height:68vh;object-fit:contain;display:block}
.gal video{width:100%}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.thumbs button{width:56px;height:42px;overflow:hidden;background:var(--well);border:1px solid var(--rule)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.dlg .stats{margin:0 0 16px}
.dlg .pricebox{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 0;border-bottom:1px solid var(--rule);margin-bottom:18px}
.dlg .price{font-size:28px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:0 0 16px}
.dl dt{color:var(--t3)} .dl dd{margin:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s;z-index:45;overflow:auto;padding:24px 28px 40px}
.drawer.open{transform:none}
.drawer h3{margin:0 0 18px;font-size:18px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12px;color:var(--t2)}
.f input,.f select,.f textarea{border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px;font-size:14px;color:var(--ink);background:#fff;width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chks{display:flex;gap:18px;font-size:13px;margin:6px 0 14px}
.chks label{display:flex;gap:6px;align-items:center}
.mstrip{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.mstrip .m{position:relative;width:72px;height:72px;overflow:hidden;background:var(--well);border:2px solid transparent}
.mstrip .m.cover{border-color:var(--ink)}
.mstrip img,.mstrip video{width:100%;height:100%;object-fit:cover}
.mstrip .m button{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px}
.mstrip .m .rm{left:auto;bottom:auto;top:0;right:0;width:18px;height:18px;padding:0}
.dacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.panel{position:fixed;inset:0;background:#fff;z-index:44;display:none;overflow:auto}
.panel.open{display:block}
.panel .in{max-width:1200px;margin:0 auto;padding:24px 32px}
.panel .top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding:8px 0 12px;z-index:1}
.panel h3{margin:0;font-size:20px;font-weight:500}
.panel p{color:var(--t2);font-size:13px;max-width:70ch}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mt{border:1px solid var(--rule)}
.mt.assigned{border-color:var(--ink)}
.mt .th{aspect-ratio:1;width:100%;object-fit:cover;background:#222;display:block}
.mt .meta{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.mt select{border:1px solid var(--rule);padding:5px;font-size:12px;width:100%}
.mt .fn{color:var(--t3)}
.mt label{display:flex;gap:6px;align-items:center;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:60}
.toast.show{display:block}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:42}
.scrim.open{display:block}
</style>
</head>
<body>
<div class="sheet">
  <nav class="nav">
    <span class="brand" id="navTitle"></span>
    <div class="right">
      <div class="pill" role="group" aria-label="Currency"><button id="usd" aria-pressed="true">USD</button><button id="aed" aria-pressed="false">AED</button></div>
      <button class="icon" id="vGrid" aria-pressed="true" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
      <button class="icon" id="vList" aria-pressed="false" aria-label="List view"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </nav>
  <div class="adm"><b>Admin</b>
    <button id="aEditPage">Edit header</button><button id="aAdd">Add listing</button><button id="aMedia">Assign photos &amp; videos</button><button id="aSettings">WhatsApp &amp; passcode</button><button id="aSave">Save in browser</button><button id="aDl">Download page (mine)</button><button id="aPub">Download public page</button><button id="aExit">Exit</button>
    <span class="st" id="st"></span>
  </div>
  <header class="head">
    <div><h1 id="title"></h1><h2 id="subtitle"></h2><p id="intro"></p></div>
    <div class="sortbox"><select id="sort" aria-label="Sort"><option value="order">Featured</option><option value="pdesc">Price: high to low</option><option value="pasc">Price: low to high</option><option value="save">Biggest saving</option><option value="new">Newest</option></select></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <button class="mfilt" id="mfilt">Filters <span id="fcount"></span></button>
  <div class="wrap">
    <aside id="aside">
      <div class="fhead"><span class="n" id="resCount"></span><button class="x" id="fClose" aria-label="Close filters" style="display:none">×</button></div>
      <input type="search" id="q" placeholder="Search" aria-label="Search">
      <div id="filters"></div>
      <button class="clear" id="clear">Clear filters</button>
    </aside>
    <section class="res">
      <div class="meta"><span id="metaCount"></span><span id="metaSel"></span></div>
      <div id="results"></div>
    </section>
  </div>
</div>

<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="box">
  <div class="top"><div><h3 id="dName"></h3><div class="brand" id="dBrand"></div></div><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="gal" id="dGal"></div><div class="thumbs" id="dThumbs"></div>
  <div class="pricebox"><div><div class="rrp" id="dRrp"></div><div class="status" id="dStatus"></div></div><div class="price" id="dPrice"></div></div>
  <div class="stats" id="dStats"></div>
  <dl class="dl" id="dDl"></dl>
  <p class="note" id="dNote"></p>
  <div class="cbtns"><a class="btn dark" id="dWa" target="_blank" rel="noopener">WhatsApp Serge</a><button class="btn lite" id="dCopy">Copy listing text</button><button class="btn lite" id="dLink">Copy link</button></div>
</div></div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" aria-label="Edit listing"></div>

<div class="panel" id="panel"><div class="in">
  <div class="top"><h3>Assign photos &amp; videos</h3><button class="x" id="pClose" aria-label="Close">×</button></div>
  <p>Files are in shooting order. Pick the knife for each file and tick one photo as the cover. Unassigned files stay off the page. Changes are kept when you close this — then save or download.</p>
  <div class="mgrid" id="mgrid"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const SRC="<!doctype html>\n"+document.documentElement.outerHTML;
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='knife_listings_v2'; const AED=3.6725;
let admin=false, cur='USD', view='grid', tab='all', sort='order';
const F={brand:new Set(),steel:new Set(),lock:new Set(),price:new Set(),avail:new Set()}; let q='';
try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); if(o&&o.listings) Object.assign(D,o);}}catch(e){}
D.listings.forEach(l=>{ l.category=l.category||'modern'; l.added=l.added||0; });

const CATS=[['all','All'],['modern','Modern folders'],['traditional','Traditionals'],['edc','EDC gear']];
const PRICE=[['0-150','Under $150'],['150-250','$150 – $250'],['250-400','$250 – $400'],['400-99999','$400 and up']];
const LOCAL=location.protocol==='file:';
const SITE=(D.site||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
const url=f=>`media/${encodeURIComponent(f)}`;
const img=(f,w)=>LOCAL||!SITE?url(f):`https://images.weserv.nl/?url=${encodeURIComponent(SITE+'/media/'+f)}&w=${w}&output=jpg&q=78`;
const isVid=f=>/\.(mp4|mov)$/i.test(f);
const money=n=>n==null||n===''?'':(cur==='USD'?'$'+Math.round(n).toLocaleString():'AED '+Math.round(n*AED).toLocaleString());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);};
const cover=l=>l.cover||l.media.find(f=>!isVid(f))||'';
const saving=l=>(l.rrp&&l.price)?Math.round((1-l.price/l.rrp)*100):0;
const lockGroup=s=>{s=(s||'').toLowerCase(); if(/auto/.test(s))return 'Automatic'; if(/slip|detent|non-locking|friction/.test(s))return 'Non-locking'; if(/frame/.test(s))return 'Frame lock'; if(/liner|bolster/.test(s))return 'Liner / bolster lock'; if(/axis|shark|button|compression|cross/.test(s))return 'Bar / button lock'; return s?'Other':'—';};
const wa=l=>`https://wa.me/${(D.whatsapp||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Hi Serge — I'd like the ${l.brand} ${l.model} (${money(l.price)}).`)}`;
const text=l=>[`${l.brand} ${l.model}`,`${l.steel} / ${l.lock} / ${l.handle}`,`Condition: ${l.condition}`,l.includes?`Includes: ${l.includes}`:'',l.notes||'',``,`RRP ${money(l.rrp)}${l.newNow?` (new today ${money(l.newNow)})`:''}`,`Price: ${money(l.price)}`].filter(x=>x!=='').join('\n');
const isAuto=l=>/auto/i.test(l.lock||'');

function pool(){ return D.listings.filter(l=>admin||!l.hidden); }
function filtered(){
  let a=pool().filter(l=>tab==='all'||l.category===tab);
  if(q){const s=q.toLowerCase(); a=a.filter(l=>`${l.brand} ${l.model} ${l.steel} ${l.handle} ${l.lock} ${l.notes}`.toLowerCase().includes(s));}
  if(F.brand.size) a=a.filter(l=>F.brand.has(l.brand));
  if(F.steel.size) a=a.filter(l=>F.steel.has(l.steel));
  if(F.lock.size) a=a.filter(l=>F.lock.has(lockGroup(l.lock)));
  if(F.price.size) a=a.filter(l=>[...F.price].some(b=>{const [lo,hi]=b.split('-').map(Number);return l.price>=lo&&l.price<hi;}));
  if(F.avail.size) a=a.filter(l=>F.avail.has(l.sold?'Sold':'Available'));
  const s={order:(x,y)=>x.order-y.order,pdesc:(x,y)=>(y.price||0)-(x.price||0),pasc:(x,y)=>(x.price||0)-(y.price||0),save:(x,y)=>saving(y)-saving(x),new:(x,y)=>(y.added||0)-(x.added||0)}[sort];
  return a.sort(s);
}
function renderHead(){
  document.getElementById('title').textContent=D.title; document.getElementById('navTitle').textContent=D.title;
  document.getElementById('subtitle').textContent=D.subtitle; document.getElementById('intro').textContent=D.intro; document.title=D.title;
}
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  CATS.forEach(([k,n])=>{const c=k==='all'?pool().length:pool().filter(l=>l.category===k).length; if(k!=='all'&&!c&&!admin) return; const b=document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-selected',tab===k); b.innerHTML=`${n}<span>${c}</span>`; b.onclick=()=>{tab=k;render();}; t.appendChild(b);});
}
function renderFilters(){
  const src=pool().filter(l=>tab==='all'||l.category===tab);
  const uniq=fn=>[...new Set(src.map(fn).filter(Boolean))].sort();
  const box=document.getElementById('filters'); box.innerHTML='';
  const grp=(key,name,opts,open,one)=>{ if(!opts.length) return; const d=document.createElement('details'); d.className='grp'; if(open) d.open=true; d.innerHTML=`<summary>${name}</summary><div class="opts${one?' one':''}">${opts.map(([v,lab])=>`<label><input type="checkbox" ${F[key].has(v)?'checked':''} data-k="${key}" value="${esc(v)}">${esc(lab)}</label>`).join('')}</div>`; box.appendChild(d); };
  grp('brand','Brand',uniq(l=>l.brand).map(v=>[v,v]),true,true);
  grp('steel','Steel',uniq(l=>l.steel).map(v=>[v,v]),true);
  grp('lock','Lock',uniq(l=>lockGroup(l.lock)).map(v=>[v,v]),false,true);
  grp('price','Price',PRICE,false,true);
  grp('avail','Availability',[['Available','Available'],['Sold','Sold']],false,true);
  box.querySelectorAll('input').forEach(i=>i.onchange=()=>{const s=F[i.dataset.k]; i.checked?s.add(i.value):s.delete(i.value); renderResults();});
}
function card(l){
  const c=document.createElement('article'); c.className='card'+(l.sold?' is-sold':'')+(l.hidden?' is-hidden':''); c.id='k-'+l.id;
  const cv=cover(l);
  c.innerHTML=`<div class="ctop"><div><div class="name">${esc(l.model)}</div><div class="brand">${esc(l.brand)}</div></div><div class="pr"><div class="price">${money(l.price)}</div><div class="rrp">RRP <s>${money(l.rrp)}</s>${saving(l)>0?` · ${saving(l)}% off`:''}</div><div class="status${l.sold?' sold':''}">${l.sold?'Sold':l.hidden?'Hidden':esc(l.condition)}</div></div></div>
    <div class="ctools"><button data-e title="Edit">✎ edit</button><button data-h title="${l.hidden?'Show':'Hide'}">${l.hidden?'show':'hide'}</button><button data-s title="${l.sold?'Mark available':'Mark sold'}">${l.sold?'unsold':'sold'}</button><button data-u title="Move up">↑</button><button data-d title="Move down">↓</button></div>
    <div class="img" data-open>${cv?`<img src="${img(cv,900)}" alt="${esc(l.brand+' '+l.model)}" loading="lazy">`:'No photos yet'}</div>
    <div class="stats"><div><b>${esc(l.steel||'—')}</b><span>Steel</span></div><div><b>${esc(l.lock||'—')}</b><span>Lock</span></div><div><b>${esc(l.handle||'—')}</b><span>Handle</span></div></div>
    <p class="note">${esc(l.notes||'')}</p>
    ${isAuto(l)||l.includes?`<div class="tags">${isAuto(l)?'<span class="tag warn">In-group sale only</span>':''}${l.includes?`<span class="tag">${esc(l.includes)}</span>`:''}</div>`:''}
    <div class="cbtns"><button class="btn dark" data-open>See details <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><a class="btn lite" href="${wa(l)}" target="_blank" rel="noopener">WhatsApp</a></div>
`;
  wire(c,l); return c;
}
function row(l){
  const c=document.createElement('div'); c.className='row'+(l.sold?' is-sold':''); c.id='k-'+l.id; const cv=cover(l);
  c.innerHTML=`<div class="th" data-open>${cv?`<img src="${img(cv,300)}" alt="" loading="lazy">`:''}</div><div><div class="rn">${esc(l.brand)} ${esc(l.model)}</div><div class="rs">${esc(l.steel)} · ${esc(l.lock)}${isAuto(l)?' · in-group only':''}${l.hidden?' · hidden':''}</div></div><div class="rp"><div class="price">${l.sold?'Sold':money(l.price)}</div><div class="rrp">RRP <s>${money(l.rrp)}</s></div></div><div class="rb cbtns"><button class="btn lite sm" data-open>Details</button><div class="ctools"><button data-e>✎</button><button data-h>${l.hidden?'◐':'◯'}</button><button data-s>${l.sold?'↺':'✓'}</button><button data-u>↑</button><button data-d>↓</button></div></div>`;
  wire(c,l); return c;
}
function wire(c,l){
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(l));
  if(!admin) return;
  const g=s=>c.querySelector(s); if(!g('[data-e]')) return;
  g('[data-e]').onclick=()=>openEditor(l); g('[data-h]').onclick=()=>{l.hidden=!l.hidden;persist();render();}; g('[data-s]').onclick=()=>{l.sold=!l.sold;persist();render();};
  g('[data-u]').onclick=()=>move(l,-1); g('[data-d]').onclick=()=>move(l,1);
}
function move(l,d){const a=D.listings.slice().sort((x,y)=>x.order-y.order);const i=a.indexOf(l),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];persist();render();}
function renderResults(){
  const r=document.getElementById('results'); r.innerHTML=''; const a=filtered();
  const avail=a.filter(l=>!l.sold).length;
  document.getElementById('resCount').textContent=`${a.length} listed`; document.getElementById('metaCount').textContent=`${avail} available`;
  const n=Object.values(F).reduce((s,x)=>s+x.size,0)+(q?1:0); document.getElementById('fcount').textContent=n?`(${n})`:''; document.getElementById('metaSel').textContent=n?`${n} filter${n>1?'s':''} on`:'';
  if(!a.length){ r.innerHTML='<div class="empty">Nothing matches. Clear a filter or two.</div>'; return; }
  const w=document.createElement('div'); w.className=view==='grid'?'grid':'list'; a.forEach(l=>w.appendChild(view==='grid'?card(l):row(l))); r.appendChild(w);
}
function render(){ renderHead(); renderTabs(); renderFilters(); renderResults(); }

/* detail */
function openDetail(l){
  const d=document.getElementById('dlg');
  document.getElementById('dName').textContent=l.model; document.getElementById('dBrand').textContent=l.brand;
  const g=document.getElementById('dGal'), th=document.getElementById('dThumbs'); g.innerHTML=''; th.innerHTML='';
  const ms=[...l.media].sort((a,b)=>a===cover(l)?-1:b===cover(l)?1:0);
  ms.forEach((f,i)=>{ const e=isVid(f)?Object.assign(document.createElement('video'),{src:url(f),controls:true,playsInline:true,preload:'metadata'}):Object.assign(document.createElement('img'),{src:img(f,1600),alt:'',loading:'lazy'}); g.appendChild(e);
    const t=document.createElement('button'); t.innerHTML=isVid(f)?`<video src="${url(f)}" muted preload="metadata"></video>`:`<img src="${img(f,200)}" alt="">`; t.onclick=()=>e.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'}); th.appendChild(t); });
  if(!ms.length) g.innerHTML='<p style="color:#8a8a8a">Photos coming.</p>';
  document.getElementById('dRrp').innerHTML=`RRP <s>${money(l.rrp)}</s>${l.newNow?` · new today ${money(l.newNow)}`:''}${saving(l)>0?` · ${saving(l)}% off`:''}`;
  const st=document.getElementById('dStatus'); st.textContent=l.sold?'Sold':l.condition; st.className='status'+(l.sold?' sold':'');
  document.getElementById('dPrice').textContent=l.sold?'Sold':money(l.price);
  document.getElementById('dStats').innerHTML=`<div><b>${esc(l.steel||'—')}</b><span>Steel</span></div><div><b>${esc(l.lock||'—')}</b><span>Lock</span></div><div><b>${esc(l.handle||'—')}</b><span>Handle</span></div>`;
  document.getElementById('dDl').innerHTML=`${l.includes?`<dt>Includes</dt><dd>${esc(l.includes)}</dd>`:''}<dt>Pickup</dt><dd>${esc(D.pickup||'')}</dd>${isAuto(l)?'<dt>Note</dt><dd>Automatic — in-group sale only.</dd>':''}`;
  document.getElementById('dNote').textContent=l.notes||'';
  document.getElementById('dWa').href=wa(l);
  document.getElementById('dCopy').onclick=()=>navigator.clipboard.writeText(text(l)).then(()=>toast('Copied'));
  document.getElementById('dLink').onclick=()=>navigator.clipboard.writeText(location.href.split('#')[0]+'#'+l.id).then(()=>toast('Link copied'));
  history.replaceState(null,'','#'+l.id);
  d.classList.add('open'); document.body.style.overflow='hidden';
}
function closeDetail(){ const d=document.getElementById('dlg'); if(!d.classList.contains('open')) return; d.classList.remove('open'); document.body.style.overflow=''; document.querySelectorAll('#dGal video').forEach(v=>v.pause()); history.replaceState(null,'',location.pathname+location.search); }
document.getElementById('dClose').onclick=closeDetail;
document.getElementById('dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') closeDetail(); });

/* editor */
function openEditor(l){
  const d=document.getElementById('drawer');
  d.innerHTML=`<h3>Edit listing <button class="x" data-close aria-label="Close">×</button></h3>
    <div class="f2"><label class="f">Brand<input name="brand" value="${esc(l.brand)}"></label><label class="f">Model<input name="model" value="${esc(l.model)}"></label></div>
    <div class="f2"><label class="f">Category<select name="category">${CATS.slice(1).map(([k,n])=>`<option value="${k}" ${l.category===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="f">Condition<input name="condition" value="${esc(l.condition)}"></label></div>
    <div class="f3"><label class="f">Steel<input name="steel" value="${esc(l.steel)}"></label><label class="f">Lock<input name="lock" value="${esc(l.lock)}"></label><label class="f">Handle<input name="handle" value="${esc(l.handle)}"></label></div>
    <div class="f3"><label class="f">RRP $<input name="rrp" type="number" value="${l.rrp??''}"></label><label class="f">New today $<input name="newNow" type="number" value="${l.newNow??''}"></label><label class="f">My price $<input name="price" type="number" value="${l.price??''}"></label></div>
    <label class="f">Includes<input name="includes" value="${esc(l.includes)}" placeholder="Box, papers, original scales"></label>
    <label class="f">Notes<textarea name="notes" rows="3">${esc(l.notes)}</textarea></label>
    <div class="chks"><label><input type="checkbox" name="hidden" ${l.hidden?'checked':''}> Hidden from public</label><label><input type="checkbox" name="sold" ${l.sold?'checked':''}> Sold</label></div>
    <div class="f">Photos &amp; video — tap "cover" to set the main photo</div><div class="mstrip" data-strip></div>
    <div class="dacts"><button class="btn dark" data-done>Done</button><button class="btn lite" data-media>Add from folder</button><button class="btn lite" data-del style="margin-left:auto;color:#9a3b2c;border-color:#d8b4a5">Delete</button></div>`;
  const strip=()=>{ const s=d.querySelector('[data-strip]'); s.innerHTML=''; l.media.forEach(f=>{ const m=document.createElement('div'); m.className='m'+(cover(l)===f?' cover':''); m.innerHTML=(isVid(f)?`<video src="${url(f)}" muted preload="metadata"></video>`:`<img src="${img(f,200)}" alt="" loading="lazy">`)+(isVid(f)?'':'<button data-c>cover</button>')+'<button class="rm" data-r>×</button>'; const cb=m.querySelector('[data-c]'); if(cb) cb.onclick=()=>{l.cover=f;strip();}; m.querySelector('[data-r]').onclick=()=>{l.media=l.media.filter(x=>x!==f); if(l.cover===f) l.cover=''; strip();}; s.appendChild(m); }); };
  strip();
  d.oninput=e=>{const n=e.target.name; if(!n) return; if(e.target.type==='checkbox'){l[n]=e.target.checked;return;} let v=e.target.value; if(['rrp','newNow','price'].includes(n)) v=v===''?null:Number(v); l[n]=v;};
  d.querySelector('[data-close]').onclick=d.querySelector('[data-done]').onclick=()=>{closeEditor();persist();render();};
  d.querySelector('[data-media]').onclick=()=>openPanel(()=>openEditor(l));
  d.querySelector('[data-del]').onclick=()=>{ if(confirm(`Delete ${l.brand} ${l.model}?`)){ D.listings=D.listings.filter(x=>x!==l); closeEditor(); persist(); render(); } };
  d.classList.add('open'); document.getElementById('scrim').classList.add('open');
}
function closeEditor(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
document.getElementById('scrim').onclick=()=>{closeEditor();persist();render();};

/* media panel */
let afterPanel=null;
function openPanel(cb){
  afterPanel=cb||null;
  const p=document.getElementById('panel'), g=document.getElementById('mgrid'); g.innerHTML='';
  const opts=`<option value="">— not on the page —</option>`+D.listings.slice().sort((a,b)=>a.order-b.order).map(l=>`<option value="${l.id}">${esc(l.brand)} ${esc(l.model)}</option>`).join('');
  D.media.forEach(m=>{ const owner=D.listings.find(l=>l.media.includes(m.f)); const t=document.createElement('div'); t.className='mt'+(owner?' assigned':'');
    t.innerHTML=`${m.t==='video'?`<video class="th" src="${url(m.f)}" muted preload="metadata" playsinline></video>`:`<img class="th" src="${img(m.f,300)}" loading="lazy" alt="">`}<div class="meta"><span class="fn">${esc(m.f.replace(/^\d{8}_/,'').replace(/\.\w+$/,''))}${m.t==='video'?' · video':''}</span><select>${opts}</select>${m.t==='video'?'':`<label><input type="checkbox" ${owner&&owner.cover===m.f?'checked':''}> cover</label>`}</div>`;
    const sel=t.querySelector('select'); sel.value=owner?owner.id:'';
    sel.onchange=()=>{ D.listings.forEach(l=>{l.media=l.media.filter(f=>f!==m.f); if(l.cover===m.f) l.cover='';}); const l=D.listings.find(x=>x.id===sel.value); if(l) l.media.push(m.f); t.classList.toggle('assigned',!!l); };
    const cb2=t.querySelector('input[type=checkbox]'); if(cb2) cb2.onchange=()=>{ const l=D.listings.find(x=>x.id===sel.value); if(!l){cb2.checked=false;toast('Assign it to a knife first');return;} l.cover=cb2.checked?m.f:''; };
    g.appendChild(t); });
  p.classList.add('open'); document.body.style.overflow='hidden';
}
document.getElementById('pClose').onclick=()=>{ const p=document.getElementById('panel'); if(!p.classList.contains('open')) return; p.classList.remove('open'); document.body.style.overflow=''; persist(); render(); if(afterPanel){const f=afterPanel; afterPanel=null; f();} };

/* admin */
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); document.getElementById('st').textContent='Saved in this browser'; }catch(e){ document.getElementById('st').textContent='Browser storage off — download the page to keep changes'; } }
function exportHtml(pub){ const d=JSON.parse(JSON.stringify(D)); if(pub){ d.listings=d.listings.filter(l=>!l.hidden); d.passcode=''; } const json=JSON.stringify(d).replace(/<\/script/g,'<\\/script'); const out=SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/html'})); a.download=pub?'knives-public.html':'knives-admin.html'; a.click(); toast(pub?'Public page downloaded — hidden listings removed':'Downloaded with everything'); }
function enterAdmin(given){ if(!D.passcode){alert('This copy has no admin. Open knives-admin.html.');return;} const p=given!=null?given:prompt('Admin passcode'); if(p==null) return; if(p.trim().toLowerCase()!==String(D.passcode).trim().toLowerCase()){alert('Wrong passcode. Add #reset to the URL and reload if you think the page state is stale.');return;} admin=true; document.body.classList.add('admin'); try{ render(); toast('Admin on'); }catch(e){ alert('Admin failed to render: '+e.message+'. Add #reset to the URL and reload.'); } }
let editingHead=false;
document.getElementById('aEditPage').onclick=function(){ editingHead=!editingHead; ['title','subtitle','intro'].forEach(id=>{ const e=document.getElementById(id); e.contentEditable=editingHead; if(!editingHead) D[id]=e.textContent.trim(); }); this.textContent=editingHead?'Done editing header':'Edit header'; if(!editingHead){persist();render();} else toast('Click the title, subheader or intro to edit'); };
document.getElementById('aAdd').onclick=()=>{ const id='k'+Date.now(); const l={id,order:D.listings.length,category:tab==='all'?'modern':tab,brand:'',model:'',steel:'',handle:'',lock:'',condition:'Carried, not used',includes:'',rrp:null,newNow:null,price:null,notes:'',hidden:true,sold:false,media:[],cover:'',added:Date.now()}; D.listings.push(l); persist(); render(); openEditor(l); };
document.getElementById('aMedia').onclick=()=>openPanel();
document.getElementById('aSettings').onclick=()=>{ const w=prompt('WhatsApp number with country code',D.whatsapp||''); if(w!==null) D.whatsapp=w; const pk=prompt('Pickup line (shown in details)',D.pickup||''); if(pk!==null) D.pickup=pk; const pc=prompt('Admin passcode',D.passcode); if(pc!==null&&pc.trim()) D.passcode=pc.trim(); persist(); render(); toast('Updated'); };
document.getElementById('aSave').onclick=()=>{persist();toast('Saved in this browser');};
document.getElementById('aDl').onclick=()=>exportHtml(false); document.getElementById('aPub').onclick=()=>exportHtml(true);
document.getElementById('aExit').onclick=()=>{ admin=false; document.body.classList.remove('admin'); history.replaceState(null,'',location.pathname); render(); };

/* controls */
const press=(on,off)=>{document.getElementById(on).setAttribute('aria-pressed','true');document.getElementById(off).setAttribute('aria-pressed','false');};
document.getElementById('usd').onclick=()=>{cur='USD';press('usd','aed');renderResults();}; document.getElementById('aed').onclick=()=>{cur='AED';press('aed','usd');renderResults();};
document.getElementById('vGrid').onclick=()=>{view='grid';press('vGrid','vList');renderResults();}; document.getElementById('vList').onclick=()=>{view='list';press('vList','vGrid');renderResults();};
document.getElementById('sort').onchange=e=>{sort=e.target.value;renderResults();};
document.getElementById('q').oninput=e=>{q=e.target.value.trim();renderResults();};
document.getElementById('clear').onclick=()=>{Object.values(F).forEach(s=>s.clear()); q=''; document.getElementById('q').value=''; renderFilters(); renderResults();};
document.getElementById('mfilt').onclick=()=>{document.getElementById('aside').classList.add('open'); document.getElementById('fClose').style.display='';};
document.getElementById('fClose').onclick=()=>{document.getElementById('aside').classList.remove('open');};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDetail(); document.getElementById('pClose').click(); closeEditor(); document.getElementById('fClose').click(); } });

render();
(function(){ const h=location.hash.slice(1); if(h==='reset'){ try{localStorage.removeItem(KEY);}catch(e){} alert('Saved page state cleared. Reloading.'); location.hash=''; location.reload(); return; } if(h==='admin') enterAdmin(); else if(h.startsWith('admin=')) enterAdmin(decodeURIComponent(h.slice(6))); else if(h){ const l=D.listings.find(x=>x.id===h&&!x.hidden); if(l) openDetail(l); } })();
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='reset'){ try{localStorage.removeItem(KEY);}catch(e){} location.hash=''; location.reload(); } else if(h==='admin'&&!admin) enterAdmin(); else if(h.startsWith('admin=')&&!admin) enterAdmin(decodeURIComponent(h.slice(6))); });
</script>
</body>
