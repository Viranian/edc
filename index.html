<script>
const SRC="<!doctype html>\n"+document.documentElement.outerHTML;
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='knife_listings_v2'; const AED=3.6725;
let admin=false, cur='AED', view='grid', tab='all', sort='order';
const F={brand:new Set(),steel:new Set(),lock:new Set(),price:new Set(),avail:new Set()}; let q='';
try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); if(o&&o.listings) Object.assign(D,o);}}catch(e){}
D.listings.forEach(l=>{ l.category=l.category||'modern'; l.added=l.added||0; });

const CATS=[['all','All'],['modern','Modern folders'],['traditional','Traditionals'],['edc','EDC gear']];
const PRICE=[['0-150','Under AED 550'],['150-250','AED 550 – 900'],['250-400','AED 900 – 1,450'],['400-99999','AED 1,450 and up']];
const LOCAL=location.protocol==='file:';
const SITE=(D.site||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
const url=f=>`media/${encodeURIComponent(f)}`;
const img=(f,w)=>LOCAL||!SITE?url(f):`https://images.weserv.nl/?url=${encodeURIComponent(SITE+'/media/'+f)}&w=${w}&output=jpg&q=78`;
const isVid=f=>/\.(mp4|mov)$/i.test(f);
const money=n=>n==null||n===''?'':(cur==='USD'?'$'+Math.round(n).toLocaleString():'AED '+Math.round(n*AED).toLocaleString());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);};
const cover=l=>l.cover||l.media.find(f=>!isVid(f))||'';
const saving=l=>(l.rrp&&l.price)?Math.round((1-l.price/l.rrp)*100):0;
const lockGroup=s=>{s=(s||'').toLowerCase(); if(/auto/.test(s))return 'Automatic'; if(/slip|detent|non-locking|friction/.test(s))return 'Non-locking'; if(/frame/.test(s))return 'Frame lock'; if(/liner|bolster/.test(s))return 'Liner / bolster lock'; if(/axis|shark|button|compression|cross/.test(s))return 'Bar / button lock'; return s?'Other':'—';};
const wa=l=>`https://wa.me/${(D.whatsapp||'').replace(/\D/g,'')}?text=${encodeURIComponent(`Hi Serge — I'd like the ${l.brand} ${l.model} (${money(l.price)}).`)}`;
const text=l=>[`${l.brand} ${l.model}`,`${l.steel} / ${l.lock} / ${l.handle}`,`Condition: ${l.condition}`,l.includes?`Includes: ${l.includes}`:'',l.notes||'',``,`RRP ${money(l.rrp)}${l.newNow?` (new today ${money(l.newNow)})`:''}`,`Price: ${money(l.price)}`].filter(x=>x!=='').join('\n');
const isAuto=l=>/auto/i.test(l.lock||'');
const flipDir=f=>(D.flips&&D.flips[f])||'cw';
const markLand=(r,f,el,isL)=>{ if(isL){ r.classList.add('land'); if(flipDir(f)==='ccw') r.classList.add('ccw'); } };
const mediaEl=(f,w,opts={})=>{ const r=document.createElement('div'); r.className='rot'+(opts.cls?' '+opts.cls:''); if(isVid(f)){ const v=document.createElement('video'); v.src=url(f); v.muted=!!opts.muted; v.playsInline=true; v.preload='metadata'; v.loop=!!opts.loop; if(opts.playable) v.controls=true; v.addEventListener('loadedmetadata',()=>markLand(r,f,v,v.videoWidth>v.videoHeight)); r.appendChild(v); } else { const i=document.createElement('img'); i.src=img(f,w); i.alt=opts.alt||''; i.loading='lazy'; i.addEventListener('load',()=>markLand(r,f,i,i.naturalWidth>i.naturalHeight)); r.appendChild(i); } return r; };

function pool(){ return D.listings.filter(l=>admin||!l.hidden); }
function filtered(){
  let a=pool().filter(l=>tab==='all'||l.category===tab);
  if(q){const s=q.toLowerCase(); a=a.filter(l=>`${l.brand} ${l.model} ${l.steel} ${l.handle} ${l.lock} ${l.notes}`.toLowerCase().includes(s));}
  if(F.brand.size) a=a.filter(l=>F.brand.has(l.brand));
  if(F.steel.size) a=a.filter(l=>F.steel.has(l.steel));
  if(F.lock.size) a=a.filter(l=>F.lock.has(lockGroup(l.lock)));
  if(F.price.size) a=a.filter(l=>[...F.price].some(b=>{const [lo,hi]=b.split('-').map(Number);return l.price>=lo&&l.price<hi;}));
  if(F.avail.size) a=a.filter(l=>F.avail.has(l.sold?'Sold':'Available'));
  const s={order:(x,y)=>x.order-y.order,pdesc:(x,y)=>(y.price||0)-(x.price||0),pasc:(x,y)=>(x.price||0)-(y.price||0),save:(x,y)=>saving(y)-saving(x),new:(x,y)=>(y.added||0)-(x.added||0)}[sort];
  return a.sort(s);
}
function renderHead(){
  document.getElementById('title').textContent=D.title; document.getElementById('navTitle').textContent=D.title;
  document.getElementById('subtitle').textContent=D.subtitle; document.getElementById('intro').textContent=D.intro; document.title=D.title;
}
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  CATS.forEach(([k,n])=>{const c=k==='all'?pool().length:pool().filter(l=>l.category===k).length; if(k!=='all'&&!c&&!admin) return; const b=document.createElement('button'); b.setAttribute('role','tab'); b.setAttribute('aria-selected',tab===k); b.innerHTML=`${n}<span>${c}</span>`; b.onclick=()=>{tab=k;render();}; t.appendChild(b);});
}
function renderFilters(){
  const src=pool().filter(l=>tab==='all'||l.category===tab);
  const uniq=fn=>[...new Set(src.map(fn).filter(Boolean))].sort();
  const box=document.getElementById('filters'); box.innerHTML='';
  const grp=(key,name,opts,open,one)=>{ if(!opts.length) return; const d=document.createElement('details'); d.className='grp'; if(open) d.open=true; d.innerHTML=`<summary>${name}</summary><div class="opts${one?' one':''}">${opts.map(([v,lab])=>`<label><input type="checkbox" ${F[key].has(v)?'checked':''} data-k="${key}" value="${esc(v)}">${esc(lab)}</label>`).join('')}</div>`; box.appendChild(d); };
  grp('brand','Brand',uniq(l=>l.brand).map(v=>[v,v]),true,true);
  grp('steel','Steel',uniq(l=>l.steel).map(v=>[v,v]),true);
  grp('lock','Lock',uniq(l=>lockGroup(l.lock)).map(v=>[v,v]),false,true);
  grp('price','Price',PRICE,false,true);
  grp('avail','Availability',[['Available','Available'],['Sold','Sold']],false,true);
  box.querySelectorAll('input').forEach(i=>i.onchange=()=>{const s=F[i.dataset.k]; i.checked?s.add(i.value):s.delete(i.value); renderResults();});
}
function card(l){
  const c=document.createElement('article'); c.className='card'+(l.sold?' is-sold':'')+(l.hidden?' is-hidden':''); c.id='k-'+l.id;
  const cv=cover(l);
  c.innerHTML=`<div class="ctools"><button data-e>Edit</button><button data-h>${l.hidden?'Show':'Hide'}</button><button data-s>${l.sold?'Unsold':'Sold'}</button><span class="sp"><button data-u title="Move up">↑</button><button data-d title="Move down">↓</button></span></div>
    <div class="img" data-open>${cv?'':'No photos yet'}</div>
    <div class="body">
      <div><div class="name">${esc(l.model)}</div><div class="brand">${esc(l.brand)}</div></div>
      <div class="pr"><div class="price">${l.sold?'Sold':money(l.price)}</div><div class="rrp">RRP <s>${money(l.rrp)}</s>${saving(l)>0?` · ${saving(l)}% off`:''}</div></div>
      <div class="status${l.sold?' sold':''}">${l.sold?'Sold':l.hidden?'Hidden':esc(l.condition)}${isAuto(l)?' · in-group sale only':''}</div>
      <dl class="specs"><dt>Steel</dt><dd>${esc(l.steel||'—')}</dd><dt>Lock</dt><dd>${esc(l.lock||'—')}</dd><dt>Handle</dt><dd title="${esc(l.handle||'')}">${esc(l.handle||'—')}</dd></dl>
      ${l.notes?`<p class="note">${esc(l.notes)}</p>`:''}
      <div class="cbtns"><button class="btn dark" data-open>Details</button><a class="btn lite" href="${wa(l)}" target="_blank" rel="noopener">WhatsApp</a></div>
    </div>`;
  if(cv) c.querySelector('.img').appendChild(mediaEl(cv,900,{alt:l.brand+' '+l.model}));
  wire(c,l); return c;
}
function row(l){
  const c=document.createElement('div'); c.className='row'+(l.sold?' is-sold':''); c.id='k-'+l.id; const cv=cover(l);
  c.innerHTML=`<div class="th" data-open></div><div><div class="rn">${esc(l.brand)} ${esc(l.model)}</div><div class="rs">${esc(l.steel)} · ${esc(l.lock)}${isAuto(l)?' · in-group only':''}${l.hidden?' · hidden':''}</div></div><div class="rp"><div class="price">${l.sold?'Sold':money(l.price)}</div><div class="rrp">RRP <s>${money(l.rrp)}</s></div></div><div class="rb cbtns"><button class="btn lite sm" data-open>Details</button><div class="ctools"><button data-e>✎</button><button data-h>${l.hidden?'◐':'◯'}</button><button data-s>${l.sold?'↺':'✓'}</button><button data-u>↑</button><button data-d>↓</button></div></div>`;
  if(cv) c.querySelector('.th').appendChild(mediaEl(cv,300));
  wire(c,l); return c;
}
function wire(c,l){
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(l));
  if(!admin) return;
  const g=s=>c.querySelector(s); if(!g('[data-e]')) return;
  g('[data-e]').onclick=()=>openEditor(l); g('[data-h]').onclick=()=>{l.hidden=!l.hidden;persist();render();}; g('[data-s]').onclick=()=>{l.sold=!l.sold;persist();render();};
  g('[data-u]').onclick=()=>move(l,-1); g('[data-d]').onclick=()=>move(l,1);
}
function move(l,d){const a=D.listings.slice().sort((x,y)=>x.order-y.order);const i=a.indexOf(l),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];persist();render();}
function renderResults(){
  const r=document.getElementById('results'); r.innerHTML=''; const a=filtered();
  const avail=a.filter(l=>!l.sold).length;
  document.getElementById('resCount').textContent=`${a.length} listed`; document.getElementById('metaCount').textContent=`${avail} available`;
  const n=Object.values(F).reduce((s,x)=>s+x.size,0)+(q?1:0); document.getElementById('fcount').textContent=n?`(${n})`:''; document.getElementById('metaSel').textContent=n?`${n} filter${n>1?'s':''} on`:'';
  if(!a.length){ r.innerHTML='<div class="empty">Nothing matches. Clear a filter or two.</div>'; return; }
  const w=document.createElement('div'); w.className=view==='grid'?'grid':'list'; a.forEach(l=>w.appendChild(view==='grid'?card(l):row(l))); r.appendChild(w);
}
function render(){ renderHead(); renderTabs(); renderFilters(); renderResults(); }

/* detail */
function openDetail(l){
  const d=document.getElementById('dlg');
  document.getElementById('dName').textContent=l.model; document.getElementById('dBrand').textContent=l.brand;
  const g=document.getElementById('dGal'), th=document.getElementById('dThumbs'); g.innerHTML=''; th.innerHTML='';
  const ms=[...l.media].sort((a,b)=>a===cover(l)?-1:b===cover(l)?1:0);
  ms.forEach((f,i)=>{ const e=mediaEl(f,1600,{playable:true}); g.appendChild(e);
    const t=document.createElement('button'); t.appendChild(mediaEl(f,200,{muted:true})); t.onclick=()=>e.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'}); th.appendChild(t); });
  if(!ms.length) g.innerHTML='<p style="color:#8a8a8a">Photos coming.</p>';
  document.getElementById('dRrp').innerHTML=`RRP <s>${money(l.rrp)}</s>${l.newNow?` · new today ${money(l.newNow)}`:''}${saving(l)>0?` · ${saving(l)}% off`:''}`;
  const st=document.getElementById('dStatus'); st.textContent=l.sold?'Sold':l.condition; st.className='status'+(l.sold?' sold':'');
  document.getElementById('dPrice').textContent=l.sold?'Sold':money(l.price);
  document.getElementById('dStats').innerHTML=`<div><b>${esc(l.steel||'—')}</b><span>Steel</span></div><div><b>${esc(l.lock||'—')}</b><span>Lock</span></div><div><b>${esc(l.handle||'—')}</b><span>Handle</span></div>`;
  document.getElementById('dDl').innerHTML=`${l.includes?`<dt>Includes</dt><dd>${esc(l.includes)}</dd>`:''}<dt>Pickup</dt><dd>${esc(D.pickup||'')}</dd>${isAuto(l)?'<dt>Note</dt><dd>Automatic — in-group sale only.</dd>':''}`;
  document.getElementById('dNote').textContent=l.notes||'';
  document.getElementById('dWa').href=wa(l);
  document.getElementById('dCopy').onclick=()=>navigator.clipboard.writeText(text(l)).then(()=>toast('Copied'));
  document.getElementById('dLink').onclick=()=>navigator.clipboard.writeText(location.href.split('#')[0]+'#'+l.id).then(()=>toast('Link copied'));
  history.replaceState(null,'','#'+l.id);
  d.classList.add('open'); document.body.style.overflow='hidden';
}
function closeDetail(){ const d=document.getElementById('dlg'); if(!d.classList.contains('open')) return; d.classList.remove('open'); document.body.style.overflow=''; document.querySelectorAll('#dGal video').forEach(v=>v.pause()); document.querySelectorAll('#dGal .rot').forEach(r=>r.classList.remove('playing')); history.replaceState(null,'',location.pathname+location.search); }
document.getElementById('dClose').onclick=closeDetail;
document.getElementById('dlg').addEventListener('click',e=>{ if(e.target.id==='dlg') closeDetail(); });

/* editor */
function openEditor(l){
  const d=document.getElementById('drawer');
  d.innerHTML=`<h3>Edit listing <button class="x" data-close aria-label="Close">×</button></h3>
    <div class="f2"><label class="f">Brand<input name="brand" value="${esc(l.brand)}"></label><label class="f">Model<input name="model" value="${esc(l.model)}"></label></div>
    <div class="f2"><label class="f">Category<select name="category">${CATS.slice(1).map(([k,n])=>`<option value="${k}" ${l.category===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="f">Condition<input name="condition" value="${esc(l.condition)}"></label></div>
    <div class="f3"><label class="f">Steel<input name="steel" value="${esc(l.steel)}"></label><label class="f">Lock<input name="lock" value="${esc(l.lock)}"></label><label class="f">Handle<input name="handle" value="${esc(l.handle)}"></label></div>
    <div class="f3"><label class="f">RRP $<input name="rrp" type="number" value="${l.rrp??''}"></label><label class="f">New today $<input name="newNow" type="number" value="${l.newNow??''}"></label><label class="f">My price $<input name="price" type="number" value="${l.price??''}"></label></div>
    <label class="f">Includes<input name="includes" value="${esc(l.includes)}" placeholder="Box, papers, original scales"></label>
    <label class="f">Notes<textarea name="notes" rows="3">${esc(l.notes)}</textarea></label>
    <div class="chks"><label><input type="checkbox" name="hidden" ${l.hidden?'checked':''}> Hidden from public</label><label><input type="checkbox" name="sold" ${l.sold?'checked':''}> Sold</label></div>
    <div class="f">Photos &amp; video — "cover" sets the main photo, ‹ › reorder, ↻ flips a landscape shot the other way. Landscape files are turned upright automatically.</div><div class="mstrip" data-strip></div>
    <div class="f2" style="align-items:end"><label class="f">Add photo/video by filename (must be in the media folder)<input data-fn placeholder="20260920_101530.jpg"></label><button class="btn lite" data-addfn style="margin-bottom:12px">Add file</button></div>
    <div class="dacts"><button class="btn dark" data-done>Done</button><button class="btn lite" data-media>Add from folder</button><button class="btn lite" data-del style="margin-left:auto;color:#9a3b2c;border-color:#d8b4a5">Delete</button></div>`;
  const strip=()=>{ const s=d.querySelector('[data-strip]'); s.innerHTML=''; l.media.forEach((f,i)=>{ const m=document.createElement('div'); m.className='m'+(cover(l)===f?' cover':''); m.appendChild(mediaEl(f,200,{muted:true})); m.insertAdjacentHTML('beforeend',(isVid(f)?'':'<button data-c>cover</button>')+'<button class="rm" data-r>×</button><button class="mv l" data-l title="Move earlier">‹</button><button class="mv r" data-rt title="Move later">›</button><button class="fl" data-f title="Flip a landscape shot the other way">↻</button>'); m.querySelector('[data-f]').onclick=()=>{ D.flips=D.flips||{}; D.flips[f]=flipDir(f)==='cw'?'ccw':'cw'; strip(); }; const cb=m.querySelector('[data-c]'); if(cb) cb.onclick=()=>{l.cover=f;strip();}; m.querySelector('[data-r]').onclick=()=>{l.media=l.media.filter(x=>x!==f); if(l.cover===f) l.cover=''; strip();}; m.querySelector('[data-l]').onclick=()=>{ if(i>0){ [l.media[i-1],l.media[i]]=[l.media[i],l.media[i-1]]; strip(); } }; m.querySelector('[data-rt]').onclick=()=>{ if(i<l.media.length-1){ [l.media[i+1],l.media[i]]=[l.media[i],l.media[i+1]]; strip(); } }; s.appendChild(m); }); };
  strip();
  d.oninput=e=>{const n=e.target.name; if(!n) return; if(e.target.type==='checkbox'){l[n]=e.target.checked;return;} let v=e.target.value; if(['rrp','newNow','price'].includes(n)) v=v===''?null:Number(v); l[n]=v;};
  d.querySelector('[data-close]').onclick=d.querySelector('[data-done]').onclick=()=>{closeEditor();persist();render();};
  d.querySelector('[data-media]').onclick=()=>openPanel(()=>openEditor(l));
  d.querySelector('[data-addfn]').onclick=()=>{ const inp=d.querySelector('[data-fn]'); const names=inp.value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean); if(!names.length) return; names.forEach(f=>{ if(!D.media.some(m=>m.f===f)) D.media.push({f,t:isVid(f)?'video':'image'}); if(!l.media.includes(f)) l.media.push(f); }); D.media.sort((a,b)=>a.f.localeCompare(b.f)); inp.value=''; strip(); toast(names.length+' added'); };
  d.querySelector('[data-del]').onclick=()=>{ if(confirm(`Delete ${l.brand} ${l.model}?`)){ D.listings=D.listings.filter(x=>x!==l); closeEditor(); persist(); render(); } };
  d.classList.add('open'); document.getElementById('scrim').classList.add('open');
}
function closeEditor(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
document.getElementById('scrim').onclick=()=>{closeEditor();persist();render();};

/* media panel */
let afterPanel=null;
function openPanel(cb){
  afterPanel=cb||null;
  const p=document.getElementById('panel'), g=document.getElementById('mgrid'); g.innerHTML='';
  const opts=`<option value="">— not on the page —</option>`+D.listings.slice().sort((a,b)=>a.order-b.order).map(l=>`<option value="${l.id}">${esc(l.brand)} ${esc(l.model)}</option>`).join('');
  D.media.forEach(m=>{ const owner=D.listings.find(l=>l.media.includes(m.f)); const t=document.createElement('div'); t.className='mt'+(owner?' assigned':'');
    t.innerHTML=`<div class="th"></div><div class="meta"><span class="fn">${esc(m.f.replace(/^\d{8}_/,'').replace(/\.\w+$/,''))}${m.t==='video'?' · video':''}</span><select>${opts}</select>${m.t==='video'?'':`<label><input type="checkbox" ${owner&&owner.cover===m.f?'checked':''}> cover</label>`}</div>`;
    t.querySelector('.th').appendChild(mediaEl(m.f,300,{muted:true}));
    const sel=t.querySelector('select'); sel.value=owner?owner.id:'';
    sel.onchange=()=>{ D.listings.forEach(l=>{l.media=l.media.filter(f=>f!==m.f); if(l.cover===m.f) l.cover='';}); const l=D.listings.find(x=>x.id===sel.value); if(l) l.media.push(m.f); t.classList.toggle('assigned',!!l); };
    const cb2=t.querySelector('input[type=checkbox]'); if(cb2) cb2.onchange=()=>{ const l=D.listings.find(x=>x.id===sel.value); if(!l){cb2.checked=false;toast('Assign it to a knife first');return;} l.cover=cb2.checked?m.f:''; };
    g.appendChild(t); });
  p.classList.add('open'); document.body.style.overflow='hidden';
}
document.getElementById('pScan').onclick=()=>document.getElementById('pDir').click();
document.getElementById('pDir').onchange=e=>{ const files=[...e.target.files].map(f=>f.name).filter(n=>/\.(jpe?g|png|webp|mp4|mov)$/i.test(n)); let added=0; files.forEach(f=>{ if(!D.media.some(m=>m.f===f)){ D.media.push({f,t:isVid(f)?'video':'image'}); added++; } }); D.media.sort((a,b)=>a.f.localeCompare(b.f)); e.target.value=''; persist(); toast(added?added+' new file'+(added>1?'s':'')+' added':'Nothing new in that folder'); openPanel(afterPanel); };
document.getElementById('pClose').onclick=()=>{ const p=document.getElementById('panel'); if(!p.classList.contains('open')) return; p.classList.remove('open'); document.body.style.overflow=''; persist(); render(); if(afterPanel){const f=afterPanel; afterPanel=null; f();} };

/* admin */
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); document.getElementById('st').textContent='Saved in this browser'; }catch(e){ document.getElementById('st').textContent='Browser storage off — download the page to keep changes'; } }
function exportHtml(pub){ const d=JSON.parse(JSON.stringify(D)); if(pub){ d.listings=d.listings.filter(l=>!l.hidden); d.passcode=''; } const json=JSON.stringify(d).replace(/<\/script/g,'<\\/script'); const out=SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/html'})); a.download=pub?'knives-public.html':'knives-admin.html'; a.click(); toast(pub?'Public page downloaded — hidden listings removed':'Downloaded with everything'); }
function enterAdmin(given){ if(!D.passcode){alert('This copy has no admin. Open knives-admin.html.');return;} const p=given!=null?given:prompt('Admin passcode'); if(p==null) return; if(p.trim().toLowerCase()!==String(D.passcode).trim().toLowerCase()){alert('Wrong passcode. Add #reset to the URL and reload if you think the page state is stale.');return;} admin=true; document.body.classList.add('admin'); try{ render(); toast('Admin on'); }catch(e){ alert('Admin failed to render: '+e.message+'. Add #reset to the URL and reload.'); } }
let editingHead=false;
document.getElementById('aEditPage').onclick=function(){ editingHead=!editingHead; ['title','subtitle','intro'].forEach(id=>{ const e=document.getElementById(id); e.contentEditable=editingHead; if(!editingHead) D[id]=e.textContent.trim(); }); this.textContent=editingHead?'Done editing header':'Edit header'; if(!editingHead){persist();render();} else toast('Click the title, subheader or intro to edit'); };
document.getElementById('aAdd').onclick=()=>{ const id='k'+Date.now(); const l={id,order:D.listings.length,category:tab==='all'?'modern':tab,brand:'',model:'',steel:'',handle:'',lock:'',condition:'Carried, not used',includes:'',rrp:null,newNow:null,price:null,notes:'',hidden:true,sold:false,media:[],cover:'',added:Date.now()}; D.listings.push(l); persist(); render(); openEditor(l); };
document.getElementById('aMedia').onclick=()=>openPanel();
document.getElementById('aSettings').onclick=()=>{ const w=prompt('WhatsApp number with country code',D.whatsapp||''); if(w!==null) D.whatsapp=w; const pk=prompt('Pickup line (shown in details)',D.pickup||''); if(pk!==null) D.pickup=pk; const pc=prompt('Admin passcode',D.passcode); if(pc!==null&&pc.trim()) D.passcode=pc.trim(); persist(); render(); toast('Updated'); };
document.getElementById('aSave').onclick=()=>{persist();toast('Saved in this browser');};
document.getElementById('aDl').onclick=()=>exportHtml(false); document.getElementById('aPub').onclick=()=>exportHtml(true);
document.getElementById('aExit').onclick=()=>{ admin=false; document.body.classList.remove('admin'); history.replaceState(null,'',location.pathname); render(); };

/* controls */
const press=(on,off)=>{document.getElementById(on).setAttribute('aria-pressed','true');document.getElementById(off).setAttribute('aria-pressed','false');};
document.getElementById('usd').onclick=()=>{cur='USD';press('usd','aed');renderResults();}; document.getElementById('aed').onclick=()=>{cur='AED';press('aed','usd');renderResults();};
document.getElementById('vGrid').onclick=()=>{view='grid';press('vGrid','vList');renderResults();}; document.getElementById('vList').onclick=()=>{view='list';press('vList','vGrid');renderResults();};
document.getElementById('sort').onchange=e=>{sort=e.target.value;renderResults();};
document.getElementById('q').oninput=e=>{q=e.target.value.trim();renderResults();};
document.getElementById('clear').onclick=()=>{Object.values(F).forEach(s=>s.clear()); q=''; document.getElementById('q').value=''; renderFilters(); renderResults();};
document.getElementById('mfilt').onclick=()=>{document.getElementById('aside').classList.add('open'); document.getElementById('fClose').style.display='';};
document.getElementById('fClose').onclick=()=>{document.getElementById('aside').classList.remove('open');};
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDetail(); document.getElementById('pClose').click(); closeEditor(); document.getElementById('fClose').click(); } });

render();
(function(){ const h=location.hash.slice(1); if(h==='reset'){ try{localStorage.removeItem(KEY);}catch(e){} alert('Saved page state cleared. Reloading.'); location.hash=''; location.reload(); return; } if(h==='admin') enterAdmin(); else if(h.startsWith('admin=')) enterAdmin(decodeURIComponent(h.slice(6))); else if(h){ const l=D.listings.find(x=>x.id===h&&!x.hidden); if(l) openDetail(l); } })();
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h==='reset'){ try{localStorage.removeItem(KEY);}catch(e){} location.hash=''; location.reload(); } else if(h==='admin'&&!admin) enterAdmin(); else if(h.startsWith('admin=')&&!admin) enterAdmin(decodeURIComponent(h.slice(6))); });
</script></body></html>
